name: CI And PR

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Calculate Candidate Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          current_merges="$(git rev-list --count --merges origin/master 2>/dev/null || echo 0)"
          version="0.1.$((current_merges + 1))"
          echo "Candidate version after merge: ${version}"
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build Image
        run: docker build --tag "mediavault-ci:${GITHUB_SHA}" .

      - name: Check Python Version
        run: |
          docker run --rm "mediavault-ci:${GITHUB_SHA}" \
            python -c "import sys; assert sys.version_info >= (3, 14); print(sys.version)"

      - name: Compile Sources
        run: |
          docker run --rm "mediavault-ci:${GITHUB_SHA}" \
            python -m compileall -q src main.py

      - name: Run Backend Tests
        run: |
          docker run --rm "mediavault-ci:${GITHUB_SHA}" \
            python -m unittest discover -s tests -v

      - name: Verify Built Frontend
        run: |
          docker run --rm "mediavault-ci:${GITHUB_SHA}" \
            python -c "from pathlib import Path; assert Path('static/index.html').is_file(); print('frontend build ok')"

  create-and-merge-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    needs: docker-build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: deploy
    env:
      APP_VERSION: ${{ needs.docker-build-and-test.outputs.candidate_version }}
    steps:
      - name: Check Automation Token
        shell: bash
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "AUTOMATION_TOKEN is required in the deploy environment."
            exit 1
          fi

      - name: Create Or Merge Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTOMATION_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'master';

            if (head === base) {
              core.info('Branch is master, skipping auto-merge.');
              return;
            }

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            let pr = existing[0];

            if (!pr) {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title: `Auto merge ${head} into ${base}`,
                body: [
                  'This pull request was created automatically after CI passed.',
                  '',
                  `Candidate version: \`${process.env.APP_VERSION}\``,
                  `Source branch: \`${head}\``,
                  `Target branch: \`${base}\``,
                ].join('\n'),
              });
              pr = created;
              core.info(`Created PR #${pr.number}.`);
            } else {
              core.info(`Reusing PR #${pr.number}.`);
            }

            let prDetails;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              prDetails = response.data;
              if (prDetails.mergeable !== null) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }

            if (!prDetails?.mergeable) {
              core.setFailed(`PR #${pr.number} is not mergeable right now.`);
              return;
            }

            const { data: mergeResult } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'merge',
            });

            if (!mergeResult.merged) {
              core.setFailed(`PR #${pr.number} was not merged: ${mergeResult.message}`);
              return;
            }

            core.info(`Merged PR #${pr.number}.`);

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${head}`,
            });

            core.info(`Deleted branch ${head}.`);
