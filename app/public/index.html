<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="description" content="A clean, distraction-free way to watch YouTube videos.">
    <meta name="application-name" content="FFYouTube">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FFYouTube">
    <meta name="msapplication-TileColor" content="#1B1B1B">
    <meta name="msapplication-TileImage" content="<%= BASE_URL %>img/icons/mstile-150x150.png">
    <meta name="theme-color" content="#00D5CB">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>img/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>img/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>img/icons/apple-touch-icon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="60x60" href="<%= BASE_URL %>img/icons/apple-touch-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="76x76" href="<%= BASE_URL %>img/icons/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="120x120" href="<%= BASE_URL %>img/icons/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="<%= BASE_URL %>img/icons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>img/icons/apple-touch-icon-180x180.png">
    <link rel="mask-icon" href="<%= BASE_URL %>img/icons/safari-pinned-tab.svg" color="#00D5CB">
    <link rel="icon" type="image/png" sizes="192x192" href="<%= BASE_URL %>img/icons/andriod-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="<%= BASE_URL %>img/icons/andriod-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="144x144" href="<%= BASE_URL %>img/icons/msapplication-icon-144x144.png">
    <link rel="icon" type="image/png" sizes="150x150" href="<%= BASE_URL %>img/icons/mstile-150x150.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FFYouTube">
    <meta property="og:title" content="FFYouTube">
    <meta property="og:description" content="A clean, distraction-free way to watch YouTube videos.">
    <title>FFYouTube</title>
  </head>
  <body>
    <noscript>
      <strong>
        FFYouTube requires JavaScript. Please enable it to continue.
      </strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
