services:
  mediavault:
    image: "${DOCKER_IMAGE:?Set DOCKER_IMAGE}:${IMAGE_TAG:-latest}"
    container_name: mediavault
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8090}:8090"
    environment:
      APP_PORT: "8090"
      GENERAL_CONF: "settings.yaml,yt_dlp.yaml"
      DEFAULT_AUDIO_ID: "${DEFAULT_AUDIO_ID:-139}"
      AUTH_UPSTREAM_URL: "${AUTH_UPSTREAM_URL:-https://id.xho.st}"
      PLAYBACK_SECRET: "${PLAYBACK_SECRET:?Set PLAYBACK_SECRET}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY}"
      DB_URL: "${DB_URL:-sqlite+aiosqlite:///./server/app.db}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
